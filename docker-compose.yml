version: '3.8'
services:
  # qBittorrent Manager Service
  qbittorrent-manager:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qbittorrent-manager
    env_file:
      - .env
    environment:
      TORRENT_ABSOLUTE_PATH: /torrents
    volumes:
      - /path/to/torrents:/torrents
    restart: unless-stopped
